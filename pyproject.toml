[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-prediction"
version = "0.1.0"
description = "Reproducible multi-label ML pipeline for predicting drug mechanisms of action."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "iterative-stratification==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
